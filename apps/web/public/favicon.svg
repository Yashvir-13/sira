<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sira-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#18181b" />
      <stop offset="100%" stopColor="#09090b" />
    </linearGradient>
    <linearGradient id="sira-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#71717a" />
      <stop offset="100%" stopColor="#3f3f46" />
    </linearGradient>
    <linearGradient id="sira-glyph" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#e4e4e7" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with high-contrast outline -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#sira-bg)" stroke="url(#sira-border)" stroke-width="2.5" />

  <!-- Inner Subtle Specular Ring -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Geometric Modern Monogram S -->
  <path
    d="M 41 21
       C 41 21, 38 17, 32 17
       C 24.5 17, 21 21.2, 21 25.5
       C 21 31.8, 28.5 33.2, 35 35
       C 41.5 36.8, 43 39.8, 43 43.5
       C 43 49, 38.5 52, 31.5 52
       C 24 52, 20 47.5, 20 47.5"
    fill="none"
    stroke="url(#sira-glyph)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Subtle Strategic Node Point -->
  <circle cx="43" cy="20.5" r="3.2" fill="#ffffff" />
  <circle cx="19" cy="48.5" r="3.2" fill="#ffffff" />
</svg>
